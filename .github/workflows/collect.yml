# 30분마다 공고를 수집해 notices.json 을 만들고 GitHub Pages 에 배포한다.
# 아직 실행해 본 적 없는 초안이다. 첫 실행은 Actions 탭에서 workflow_dispatch 로 직접 돌려 확인한다.
#
# 준비 (공개 저장소):
#   1. Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 설정
#   2. Settings → Secrets and variables → Actions → Secrets 에 DATA_GO_KR_KEY
#      (공공데이터포털 청약홈 서비스키, Decoding 키) 추가
#   3. 앱 빌드:  --dart-define=DATA_BASE=https://<계정>.github.io/<저장소>
#
# 참고: GitHub 의 예약 실행은 몇 분씩 밀릴 수 있고, 60일간 저장소 활동이 없으면 꺼진다.
name: collect

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      push_test:
        description: '푸시 시험 발송(접수 중인 공고 1건을 구독자에게 보냅니다)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: 수집기 의존성
        run: pip install -r server/requirements.txt

      - name: 테스트
        working-directory: server
        run: python -m pytest -q

      # 이전 결과(주택형 캐시, 최초 확인 시각)를 이어받는다. 처음이라 없으면 건너뛴다.
      - name: 이전 notices.json 내려받기
        working-directory: server
        run: |
          mkdir -p public
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          curl -fsS --max-time 30 "https://${OWNER}.github.io/${REPO}/notices.json" -o public/notices.json \
            || { echo "이전 결과 없음(처음 실행)"; rm -f public/notices.json; }
          curl -fsS --max-time 30 "https://${OWNER}.github.io/${REPO}/pushes.json" -o public/pushes.json             || rm -f public/pushes.json

      - name: 공고 수집 → public/notices.json
        working-directory: server
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          PUSH_TEST: ${{ inputs.push_test && '1' || '' }}
        run: python -m app.export --out public

      - name: 개인정보처리방침 페이지 포함
        run: cp docs/privacy.html server/public/privacy.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: server/public

      - name: GitHub Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
